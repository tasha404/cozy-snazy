<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Coffee — Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="nav-placeholder"></div>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-text-block">
          
            <h1>food that feels<br>like home</h1>
            <div class="hero-cta-row">
                <a href="menu.html" class="btn-solid">see the menu</a>
                <a href="reservation.html" class="btn-outline">reserve a table</a>
            </div>
        </div>
        <div class="hero-img-wrap">
            <div class="hero-img-placeholder">🫕</div>
        </div>
    </section>


    <!-- HOURS STRIP -->
    <div class="hours-strip">
        <div class="hs-item"><span class="hs-day">Tue – Fri</span><span class="hs-time">11:30am – 8pm</span></div>
        <div class="hs-divider"></div>
        <div class="hs-item"><span class="hs-day">Sat – Sun</span><span class="hs-time">10am – 7pm</span></div>
        <div class="hs-divider"></div>
        <div class="hs-item"><span class="hs-day">Monday</span><span class="hs-time">Closed</span></div>
        <div class="hs-divider"></div>
        <div class="hs-item"><span class="hs-day">Address</span><span class="hs-time">some address</span></div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="components.js"></script>
</body>

</html>
